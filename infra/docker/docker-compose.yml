version: '3.9'
services:
  api-gateway:
    build: ../../services/api-gateway
    environment:
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on: [redis, kafka, neo4j, opensearch]

  identity-service:
    build: ../../services/identity-service
    environment:
      - PORT=8080

  intel-core:
    build: ../../services/intel-core
    environment:
      - PORT=8080

  intel-graph-engine:
    build: ../../services/intel-graph-engine
    environment:
      - PORT=8080

  intel-ingestion-engine:
    build: ../../services/intel-ingestion-engine
    environment:
      - PORT=8080

  intel-automation-engine:
    build: ../../services/intel-automation-engine
    environment:
      - PORT=8080

  intel-ai-engine:
    build: ../../services/intel-ai-engine
    environment:
      - PORT=8080

  intel-analytics-engine:
    build: ../../services/intel-analytics-engine
    environment:
      - PORT=8080

  intel-stream-engine:
    build: ../../services/intel-stream-engine
    environment:
      - PORT=8080

  intel-search-engine:
    build: ../../services/intel-search-engine
    environment:
      - PORT=8080

  intel-notification-service:
    build: ../../services/intel-notification-service
    environment:
      - PORT=8080

  connector-engine:
    build: ../../services/connector-engine
    environment:
      - PORT=8080

  frontend-ui:
    build: ../../frontend-ui
    ports:
      - "3000:3000"
    depends_on: [api-gateway]

  ioc-worker:
    build: ../../workers/ioc-worker
    depends_on: [redis]

  malware-worker:
    build: ../../workers/malware-worker
    depends_on: [redis]

  darkweb-worker:
    build: ../../workers/darkweb-worker
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  neo4j:
    image: neo4j:5.23
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/cyberintel

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
    ports: ["9200:9200"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3001:3000"]

  loki:
    image: grafana/loki:3.1.1
    ports: ["3100:3100"]
