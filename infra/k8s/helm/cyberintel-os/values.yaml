image:
  repository: ghcr.io/example/cyberintel-os
  tag: latest
  pullPolicy: IfNotPresent

services:
  - api-gateway
  - identity-service
  - intel-core
  - intel-graph-engine
  - intel-ingestion-engine
  - intel-automation-engine
  - intel-ai-engine
  - intel-analytics-engine
  - intel-stream-engine
  - intel-search-engine
  - intel-notification-service
  - connector-engine

replicaCount: 2
service:
  type: ClusterIP
  port: 8080
resources: {}
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
